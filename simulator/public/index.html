<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulsar Simulator</title>
<style>
:root{
  --bg:#05070c; --panel:#0a0f18; --line:#1b2436; --line2:#2a3550;
  --tx:#e7edf7; --dim:#8695ab; --dim2:#4d5c76;
  --cy:#22d3ee; --gr:#5cf22e; --or:#ff9a3d; --rd:#ff4d5e;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--mono);font-size:13px;
     -webkit-font-smoothing:antialiased}
#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.6}
.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:0 20px 40px;animation:wrapIn .5s ease both}
@keyframes wrapIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important}
}

/* every interactive control gets the same focus treatment, so keyboard use
   reads as deliberately supported rather than an afterthought */
button:focus-visible,.lvl:focus-visible,.fault:focus-visible,.chip:focus-visible,
.mrow select:focus-visible,input.msg:focus-visible,.dgroup:focus-visible{
  outline:2px solid var(--cy);outline-offset:2px}

/* sticky top bar: title left, the two actions that matter, right, always reachable.
   The gradient hairline underneath is the one purely decorative touch on the page —
   a slow, quiet drift, never fast enough to compete for attention with real state. */
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:rgba(5,7,12,.92);backdrop-filter:blur(6px);padding:16px 0;
  border-bottom:1px solid var(--line);position:relative}
.bar::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,var(--cy),var(--gr),var(--cy),transparent);
  background-size:200% 100%;animation:sheen 7s linear infinite;opacity:.55}
@keyframes sheen{to{background-position:-200% 0}}
.bar h1{font-size:14.5px;font-weight:600;margin:0;letter-spacing:.02em;white-space:nowrap}
.bar h1 span{color:var(--cy);display:inline-block;animation:tick 3.2s ease-in-out infinite}
@keyframes tick{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(34,211,238,0))}
  50%{transform:scale(1.12);filter:drop-shadow(0 0 6px rgba(34,211,238,.6))}}
.bar .spacer{flex:1}
.pending{font-size:10.5px;color:var(--or);white-space:nowrap;animation:fadeIn .2s ease both}
.pending.hidden{visibility:hidden}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
button.go{border:1px solid var(--line2);background:#0d1420;color:var(--dim);border-radius:7px;
  padding:8px 15px;font-family:var(--mono);font-size:12px;cursor:pointer;white-space:nowrap;
  transition:color .15s ease,border-color .15s ease,transform .1s ease,box-shadow .2s ease}
button.go:hover{color:var(--tx);border-color:#3d4c6e}
button.go:active{transform:translateY(1px) scale(.97)}
/* the one primary action on this page — solid, high-contrast, unmistakable.
   Everything else on the page is an outline/ghost button by comparison. Once
   there is something to send, it gets a slow breathing glow — quiet enough to
   ignore, noticeable enough that "Apply" doesn't just sit there looking inert. */
button.go.apply{border:1px solid var(--cy);background:var(--cy);color:#04141a;font-weight:700;
  box-shadow:0 0 0 3px rgba(34,211,238,.16)}
button.go.apply:not(:disabled){animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 3px rgba(34,211,238,.16)}
  50%{box-shadow:0 0 0 6px rgba(34,211,238,.32)}}
button.go.apply:hover{background:#52e3ff;border-color:#52e3ff}
button.go.apply:disabled{opacity:.4;cursor:default;border-color:var(--line2);background:#0d1420;
  color:var(--dim);font-weight:500;box-shadow:none;animation:none}

/* connection: URL, API key and API secret, one nicely-formatted block — the
   one place all three live, instead of scattered across two sections. The
   device-count badge sits in its corner: a live count of what's connected,
   one click away from the Devices section below. */
.conn{margin:16px 0 26px;background:linear-gradient(180deg,rgba(255,255,255,.02),transparent 60%);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.conn-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.conn-head .t{font-size:10.5px;font-weight:600;color:var(--dim2);letter-spacing:.14em;text-transform:uppercase}
.conn-head .spacer{flex:1}
.devCount{display:flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel);
  color:var(--dim);border-radius:20px;padding:4px 10px 4px 8px;font-family:var(--mono);font-size:10.5px;
  cursor:pointer;transition:border-color .15s ease,color .15s ease,transform .1s ease}
.devCount:hover{border-color:#3d4c6e;color:var(--tx);transform:translateY(-1px)}
.devCount:active{transform:translateY(0) scale(.96)}
.devCount .ddot{width:6px;height:6px;border-radius:50%;background:var(--dim2);flex:none}
.devCount .ddot.on{background:var(--gr);box-shadow:0 0 0 0 rgba(92,242,46,.55);animation:pulse 1.8s ease-out infinite}
.conn-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);
  padding:5px 0}
.conn-row .cl{width:78px;flex:none;color:var(--dim2);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.conn-row.off{opacity:.45}
.conn code{color:var(--cy);font-size:12px;background:var(--panel);border:1px solid var(--line);
  border-radius:6px;padding:4px 9px;overflow-wrap:anywhere}
.conn button{border:none;background:none;color:var(--dim2);cursor:pointer;font-family:var(--mono);
  font-size:11px;text-decoration:underline;text-underline-offset:2px;padding:0}
.conn button:hover{color:var(--tx)}

section{margin-bottom:24px;padding:14px 16px;background:linear-gradient(180deg,rgba(255,255,255,.014),transparent 40%);
  border:1px solid transparent;border-radius:12px;transition:border-color .25s ease,background .25s ease}
section:hover{border-color:var(--line)}
section > h2{margin:0 0 10px;font-size:10.5px;font-weight:600;color:var(--dim2);letter-spacing:.14em;
  text-transform:uppercase}

/* alert: three pills + a single-line message field, inline, plus a row of
   canned outcome presets scoped to whichever level is currently picked */
.lvls{display:flex;gap:6px;margin-bottom:8px}
.lvl{flex:1;border:1px solid var(--line2);background:var(--panel);border-radius:7px;padding:8px 0;
  text-align:center;font-size:11px;letter-spacing:.07em;cursor:pointer;color:var(--dim);
  transition:border-color .15s ease,color .15s ease,background .15s ease,transform .1s ease}
.lvl:hover{border-color:#3d4c6e;color:var(--tx);transform:translateY(-1px)}
.lvl:active{transform:translateY(0) scale(.98)}
.lvl.sel[data-l=info]{border-color:#1f7a44;background:#08210f;color:var(--gr)}
.lvl.sel[data-l=warn]{border-color:#8a4610;background:#20100a;color:var(--or)}
.lvl.sel[data-l=crit]{border-color:#8a2530;background:#220a0d;color:var(--rd)}
.lvl.sel[data-a=off]{border-color:var(--line2);background:#0d1420;color:var(--tx)}
.lvl.sel[data-a=on]{border-color:#1f7a44;background:#08210f;color:var(--gr)}
input.msg{width:100%;background:var(--panel);border:1px solid var(--line2);color:var(--tx);
  border-radius:7px;padding:8px 10px;font-family:var(--mono);font-size:12px;
  transition:border-color .15s ease}
input.msg:focus{outline:none;border-color:var(--cy)}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:5px 10px;
  font-size:10.5px;color:var(--dim);cursor:pointer;
  transition:border-color .15s ease,color .15s ease,transform .1s ease}
.chip:hover{border-color:#3d4c6e;color:var(--tx);transform:translateY(-1px)}
.chip:active{transform:translateY(0) scale(.96)}
.chip.sel{border-color:var(--cy);color:var(--cy)}

/* faults: one row of small pills — clicking one only stages it; it takes
   effect on Apply, the same as everything else on this page */
.faults{display:flex;flex-wrap:wrap;gap:6px}
.fault{border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:7px 11px;
  cursor:pointer;font-size:10.5px;color:var(--dim);
  transition:border-color .15s ease,color .15s ease,background .15s ease,transform .1s ease}
.fault:hover{border-color:#3d4c6e;color:var(--tx);transform:translateY(-1px)}
.fault:active{transform:translateY(0) scale(.96)}
.fault.on{border-color:#8a2530;background:#220a0d;color:var(--rd)}
.fault.none{color:var(--dim2)}
.fault.none.on{border-color:var(--line2);background:var(--panel);color:var(--tx)}
.fault.pend{border-color:var(--or);color:var(--or);background:#20140a}
.fault.none.pend{border-color:var(--or);background:#0d1420;color:var(--or)}

/* metrics: compact rows, not heavy cards */
.metrics{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mrow{display:grid;grid-template-columns:112px 1fr 150px;gap:14px;align-items:center;
  padding:11px 14px;border-bottom:1px solid var(--line);transition:background .15s ease}
.mrow:last-child{border-bottom:none}
.mrow:nth-child(odd){background:#070a11}
.mrow:hover{background:#0d1420}
.mrow .id .name{font-size:12px;display:block}
.mrow .id .gw{color:var(--dim2);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase}
.mrow .viz{display:flex;align-items:center;gap:12px;min-width:0}
.mrow svg{display:block;width:100px;height:26px;flex:none}
.mrow .stats{color:var(--dim);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .stats b{color:var(--tx);font-weight:500}
.mrow .stats .warn{color:var(--or)}
.mrow .stats .crit{color:var(--rd)}
.mrow select{width:100%;background:var(--panel);border:1px solid var(--line2);color:var(--tx);
  border-radius:6px;padding:6px 8px;font-family:var(--mono);font-size:11px;
  transition:border-color .15s ease,color .15s ease}
.mrow select:focus{outline:none;border-color:var(--cy)}
.mrow select.changed{border-color:var(--or);color:var(--or)}

.log{font-size:10.5px;line-height:1.7;color:var(--dim2);max-height:150px;overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.log div{white-space:pre-wrap;word-break:break-word}
.log div.new{animation:logIn .35s ease both}
@keyframes logIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}

/* devices: one compact row each — a dot, who, where, how much, how recent.
   A row expands in place to show its own recent request/response history. */
.devices{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.drow{display:grid;grid-template-columns:10px 1fr auto;gap:12px;align-items:center;
  padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s ease}
.devices > div:last-child .drow{border-bottom:none}
.drow:hover{background:#0d1420}
.dgroup:nth-child(odd) .drow{background:#070a11}
.dgroup:nth-child(odd) .drow:hover{background:#0d1420}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim2);flex:none}
.dot.on{background:var(--gr);box-shadow:0 0 0 0 rgba(92,242,46,.55);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(92,242,46,.5)}
  70%{box-shadow:0 0 0 6px rgba(92,242,46,0)}
  100%{box-shadow:0 0 0 0 rgba(92,242,46,0)}
}
.drow .who{font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .who .sub{color:var(--dim2);font-size:9.5px;letter-spacing:.05em;margin-left:8px}
.drow .who .chev{color:var(--dim2);margin-right:6px;display:inline-block;transition:transform .12s}
.dgroup.open .drow .chev{transform:rotate(90deg)}
.drow .meta{color:var(--dim);font-size:10px;text-align:right;white-space:nowrap}
.devices-empty{padding:16px 14px;color:var(--dim2);font-size:11px;text-align:center}
/* the accordion: max-height 0 -> a generous fixed cap (well over the 20-row
   history limit), clipped by overflow. The grid-rows/fr-unit version of
   this looked elegant but did not actually collapse to zero in practice —
   this plainer technique is the one that reliably does.                  */
.dhist{max-height:0;overflow:hidden;transition:max-height .22s ease}
.dhist.open{max-height:500px}
.dhist-body{padding:2px 14px 10px 34px;border-bottom:1px solid var(--line);background:#070a11}
.dgroup:nth-child(even) .dhist-body{background:var(--panel)}
.dhist-row{display:grid;grid-template-columns:70px 48px 1fr;gap:10px;padding:3px 0;
  font-size:10.5px;color:var(--dim)}
.dhist-row time{color:var(--dim2)}
.dhist-row .st{font-weight:600}
.dhist-row .st.ok{color:var(--gr)}
.dhist-row .st.bad{color:var(--or)}
.dhist-empty{color:var(--dim2);font-size:10.5px;padding:4px 0}
</style>
</head>
<body>
<canvas id="bgfx" aria-hidden="true"></canvas>
<div class="wrap">

<div class="bar">
  <h1><span>⚡</span> Pulsar Simulator</h1>
  <div class="spacer"></div>
  <span class="pending hidden" id="pendingNote">unapplied changes</span>
  <button class="go" id="resetAll">Reset to defaults</button>
  <button class="go apply" id="applyAll" disabled>Apply changes</button>
</div>

<div class="conn">
  <div class="conn-head">
    <span class="t">Connection</span>
    <div class="spacer"></div>
    <button class="devCount" id="devCountBtn" title="Jump to connected devices">
      <span class="ddot" id="devCountDot"></span>
      <span id="devCountN">0</span> <span id="devCountLabel">devices</span>
    </button>
  </div>
  <div class="conn-row">
    <span class="cl">URL</span>
    <code id="epUrl">http://localhost:4180/v1/gateway_health</code>
    <button data-copy="epUrl">copy</button>
  </div>
  <div class="conn-row" id="authKeyRow">
    <span class="cl">API key</span>
    <code id="authKey">pulsar_demo_key</code>
    <button data-copy="authKey">copy</button>
  </div>
  <div class="conn-row" id="authSecretRow">
    <span class="cl">API secret</span>
    <code id="authSecret">pulsar_demo_secret</code>
    <button data-copy="authSecret">copy</button>
  </div>
</div>

<section>
  <h2>Auth</h2>
  <div class="lvls" id="authLvls">
    <div class="lvl" data-a="off">AUTH OFF</div>
    <div class="lvl" data-a="on">AUTH ON</div>
  </div>
</section>

<section>
  <h2>Alert</h2>
  <div class="lvls" id="lvls">
    <div class="lvl" data-l="info">INFO</div>
    <div class="lvl" data-l="warn">WARN</div>
    <div class="lvl" data-l="crit">CRIT</div>
  </div>
  <input class="msg" id="msg" maxlength="20" placeholder="≤ 20 chars, one line">
  <div class="presets" id="presets"></div>
</section>

<section>
  <h2>Faults</h2>
  <div class="faults" id="faults"></div>
</section>

<section>
  <h2>Metrics</h2>
  <div class="metrics" id="metrics"></div>
</section>

<section id="devicesSection">
  <h2>Devices</h2>
  <div class="devices" id="devices"></div>
</section>

<section>
  <h2>Log</h2>
  <div class="log" id="log"></div>
</section>

</div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];

const DEFAULT_MSG = {
  info: 'error budget healthy',
  warn: '5xx 0.68% max 0.50%',
  crit: '5xx 2.14% max 0.50%',
};
/* Canned outcomes a person can pick with one click instead of typing —
   every string here is checked to be <= 20 chars, same cap as the input. */
const PRESET_MSG = {
  info: [
    'error budget healthy',
    'all systems normal',
    'nominal, no action',
    'steady state',
    'healthy, no errors',
  ],
  warn: [
    '5xx 0.68% max 0.50%',
    'latency creeping up',
    'elevated 4xx rate',
    'retry storm rising',
    'degraded, watching',
  ],
  crit: [
    '5xx 2.14% max 0.50%',
    'gateway unreachable',
    'error spike ongoing',
    'cascading failures',
    'page on-call now',
  ],
};

let state = null;                 // last known server state — never mutated by hand
/* Everything the user has chosen but not yet sent. Editable controls read
   and write ONLY this object; a background log refresh never touches it,
   so picking a pattern can never get silently reset out from under you.
   previews[key] holds a locally-computed {buckets, aggregates}
   for a chosen-but-not-applied pattern, so its graph shows immediately.
   fault stays `undefined` while nothing is staged — state.fault itself can
   legally be null ("none"), so undefined is the only safe "no change" mark. */
function emptyPending() { return { level: null, message: null, patterns: {}, previews: {}, fault: undefined }; }
let pending = emptyPending();

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  return res.json();
}

function hasPending() {
  return pending.level !== null || pending.message !== null
    || Object.keys(pending.patterns).length > 0 || pending.fault !== undefined;
}
function syncApplyButton() {
  const p = hasPending();
  $('#applyAll').disabled = !p;
  $('#pendingNote').classList.toggle('hidden', !p);
}

function sparkline(buckets, color = '#22d3ee') {
  const w = 100, h = 26, pad = 1;
  const hi = Math.max(1, ...buckets);
  const pts = buckets.map((v, i) => {
    const x = (i / (buckets.length - 1)) * (w - pad * 2) + pad;
    const y = h - pad - (v / hi) * (h - pad * 2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.4" />
  </svg>`;
}

/* ---------------------------------------------------------- pattern preview
   Mirrors simulator/server.js's applyPattern()/retotal() shape-for-shape,
   purely client-side, so picking a pattern redraws the graph immediately —
   before Apply sends anything, and without touching server state. The real
   values (and their randomness) are whatever the server computes when
   Apply actually runs; this is a preview of the SHAPE, not a guarantee. */
const PATTERN_GEN = {
  steady:  (b, t) => b * (0.95 + Math.random() * 0.1),
  rising:  (b, t) => b * (0.55 + 0.9 * t) * (0.95 + Math.random() * 0.1),
  falling: (b, t) => b * (1.45 - 0.9 * t) * (0.95 + Math.random() * 0.1),
  dip:     (b, t) => b * (1 - 0.6 * Math.exp(-((t - 0.5) ** 2) / 0.015)) * (0.95 + Math.random() * 0.1),
  spike:   (b, t) => b * (1 + 2.2 * Math.exp(-((t - 0.75) ** 2) / 0.003)) * (0.95 + Math.random() * 0.1),
  cliff:   (b, t) => t < 0.72 ? b * (0.95 + Math.random() * 0.1)
                              : b * (0.95 + Math.random() * 0.1) * Math.max(0.04, 1 - (t - 0.72) / 0.28),
  noisy:   (b) => b * (0.35 + Math.random() * 1.3),
};
const PATTERN_ERROR_PCT = {
  cliff:   { p4: 2.4, p5: 4.8 },
  dip:     { p4: 1.1, p5: 0.9 },
  spike:   { p4: 0.6, p5: 0.3 },
  default: { p4: 0.5, p5: 0.1 },
};
function pctOf(n, total) { return total ? Math.round((n * 100 / total) * 100) / 100 : 0; }
/* Same thresholds server.js's levelFor() uses — a preview of the SHAPE
   and the level a real Apply would compute, before Apply sends anything. */
function levelFor(name, share) {
  if (name === '5XX') return share >= 1 ? 'crit' : share >= 0.5 ? 'warn' : undefined;
  if (name === '4XX') return share >= 2 ? 'warn' : undefined;
  return undefined;
}

function previewPattern(m, patternName) {
  const gen = PATTERN_GEN[patternName];
  if (!gen) return null;
  const base = m.buckets.reduce((a, b) => a + b, 0) / 30 || 20;
  const buckets = [];
  for (let i = 0; i < 30; i++) buckets.push(Math.max(0, Math.round(gen(base, i / 29))));
  const total = buckets.reduce((a, b) => a + b, 0);
  const rates = PATTERN_ERROR_PCT[patternName] || PATTERN_ERROR_PCT.default;
  const c4 = Math.round(total * rates.p4 / 100), c5 = Math.round(total * rates.p5 / 100);
  const c2 = Math.max(0, total - c4 - c5);
  const byValue = { '2XX': c2, '4XX': c4, '5XX': c5 };
  const aggregates = m.aggregates.map((t) => {
    if (!(t.name in byValue)) return t;   // AVG/P95 (or anything else) unaffected by a bucket reshape
    const value = byValue[t.name], level = levelFor(t.name, pctOf(value, total));
    const nt = { ...t, value };
    if (level) nt.level = level; else delete nt.level;
    return nt;
  });
  return { buckets, aggregates };
}

/* Sparkline + stats for one row — from its live data, or from a pending
   preview if one is queued (rendered in amber, so "queued, not live yet"
   reads at a glance). Shared by the initial render and the 4 s refresh so
   neither one can show something different from the other.              */
function rowViz(m, key) {
  const preview = pending.previews[key];
  if (preview) {
    const shown = { ...m, buckets: preview.buckets, aggregates: preview.aggregates };
    return sparkline(preview.buckets, '#ff9a3d') + statsLine(shown);
  }
  return sparkline(m.buckets) + statsLine(m);
}
function fmtCount(n) {
  if (n < 1000) return String(n);
  if (n < 1e6) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'k';
  return (n / 1e6).toFixed(2) + 'm';
}

/* -------------------------------------------------------- editable controls
   Rendered ONCE per real change (initial load, after Apply, after Reset) —
   never by the background log poll — so a selection always survives until
   you act on it.                                                         */
/* One row's stats, from whatever of its up-to-5 aggregate tiles are
   actually present — a row need not carry 2XX/4XX/5XX at all, and this
   never assumes it does. Every tile access is presence-checked first;
   a tile that isn't there is simply not drawn, never a crash.           */
function levelClass(t) { return t.level === 'crit' || t.level === 'warn' ? t.level : ''; }
function statsLine(m) {
  const byName = (n) => (m.aggregates || []).find((t) => t && t.name === n);
  const t2 = byName('2XX'), t4 = byName('4XX'), t5 = byName('5XX');
  const parts = [];
  if (t2) parts.push(`<b>${fmtCount(t2.value)}</b> ${t2.name}`);
  if (t4) parts.push(`<span class="${levelClass(t4)}">${t4.name} ${t4.value}</span>`);
  if (t5) parts.push(`<span class="${levelClass(t5)}">${t5.name} ${t5.value}</span>`);
  return `<span class="stats">${parts.join(' · ') || 'no 2XX/4XX/5XX tiles on this row'}</span>`;
}

function renderControls() {
  const level = pending.level ?? state.alert.level;
  $$('#lvls .lvl').forEach((el) => el.classList.toggle('sel', el.dataset.l === level));
  $('#msg').value = pending.message ?? state.alert.message;
  renderPresets();

  const box = $('#metrics');
  box.innerHTML = state.metrics.map((m) => {
    const key = m.gateway + '/' + m.name;
    const opts = ['<option value="">— no change —</option>'].concat(
      Object.entries(state.patterns).map(([k, label]) => {
        const sel = pending.patterns[key] === k ? ' selected' : '';
        return `<option value="${k}"${sel}>${label}</option>`;
      })
    ).join('');
    return `<div class="mrow" data-key="${key}">
      <div class="id"><span class="name">${m.name}</span><span class="gw">${m.gateway}</span></div>
      <div class="viz">${rowViz(m, key)}</div>
      <select data-key="${key}" class="${pending.patterns[key] ? 'changed' : ''}">${opts}</select>
    </div>`;
  }).join('');
  $$('select', box).forEach((sel) => sel.onchange = () => {
    const key = sel.dataset.key;
    const m = state.metrics.find((mm) => mm.gateway + '/' + mm.name === key);
    if (sel.value) { pending.patterns[key] = sel.value; pending.previews[key] = previewPattern(m, sel.value); }
    else { delete pending.patterns[key]; delete pending.previews[key]; }
    sel.classList.toggle('changed', !!sel.value);
    sel.closest('.mrow').querySelector('.viz').innerHTML = rowViz(m, key);
    syncApplyButton();
  });

  renderFaults();
  renderAuth();
}

/* Preset outcome chips for whichever level is currently picked (pending,
   or live if nothing is staged) — clicking one just stages a message,
   same as typing into the field, so it still waits for Apply.           */
function renderPresets() {
  const level = pending.level ?? state.alert.level;
  const current = pending.message ?? state.alert.message;
  const opts = PRESET_MSG[level] || [];
  $('#presets').innerHTML = opts.map((m) =>
    `<div class="chip${m === current ? ' sel' : ''}" data-m="${esc(m)}">${esc(m)}</div>`
  ).join('');
  $$('.chip', $('#presets')).forEach((el) => el.onclick = () => {
    $('#msg').value = el.dataset.m;
    pending.message = el.dataset.m;
    renderPresets();
    syncApplyButton();
  });
}

function renderAuth() {
  const enabled = !!(state.auth && state.auth.enabled);
  $$('#authLvls .lvl').forEach((el) => el.classList.toggle('sel', (el.dataset.a === 'on') === enabled));
  if (state.auth){ $('#authKey').textContent = state.auth.apiKey; $('#authSecret').textContent = state.auth.apiSecret; }
  $('#authSecretRow').classList.toggle('off', !enabled);
}
$$('#authLvls .lvl').forEach((el) => el.onclick = async () => {
  await api('POST', '/api/auth', { enabled: el.dataset.a === 'on' });
  state = await api('GET', '/api/state');
  renderAuth();       // instant — auth on/off is a mode switch, not a batched edit
  renderLog();
});
$$('.conn button[data-copy]').forEach((btn) => btn.onclick = () => {
  const text = $('#' + btn.dataset.copy).textContent;
  navigator.clipboard?.writeText(text).catch(() => {});
  const was = btn.textContent; btn.textContent = 'copied';
  setTimeout(() => { btn.textContent = was; }, 1200);
});

function renderFaults() {
  const box = $('#faults');
  const entries = [['', 'none']].concat(Object.entries(state.faults));
  const staged = pending.fault !== undefined;
  const current = staged ? pending.fault : (state.fault || '');
  box.innerHTML = entries.map(([key, label]) =>
    `<div class="fault${key === '' ? ' none' : ''}${current === key ? ' on' : ''}${staged && pending.fault === key ? ' pend' : ''}" data-f="${key}">${label}</div>`
  ).join('');
  $$('.fault', box).forEach((el) => el.onclick = () => {
    pending.fault = el.dataset.f || '';
    renderFaults();       // staged only — takes effect on Apply, like everything else here
    syncApplyButton();
  });
}

/* -------------------------------------------------------------- live-only
   Safe to call on a timer: touches the sparkline/stats readouts and the
   log, never the alert form or the pattern dropdowns.                    */
function renderLiveReadouts() {
  const box = $('#metrics');
  state.metrics.forEach((m) => {
    const key = m.gateway + '/' + m.name;
    const row = $(`.mrow[data-key="${key}"]`, box);
    if (!row) return;
    row.querySelector('.viz').innerHTML = rowViz(m, key);   // a queued preview stays shown, not overwritten
  });
  renderLog();
}
let lastLogTop = null;
function renderLog() {
  const lines = state.log;
  $('#log').innerHTML = lines.map((l, i) => {
    const isNew = i === 0 && l !== lastLogTop && lastLogTop !== null;
    return `<div${isNew ? ' class="new"' : ''}>${l.replace(/</g, '&lt;')}</div>`;
  }).join('');
  lastLogTop = lines[0] ?? null;
}

function fmtAgo(ms) {
  const s = Math.max(0, Math.floor((Date.now() - ms) / 1000));
  if (s < 3) return 'now';
  if (s < 60) return s + 's ago';
  const m = Math.floor(s / 60);
  if (m < 60) return m + 'm ago';
  return Math.floor(m / 60) + 'h ago';
}
function esc(s) { return String(s == null ? '' : s).replace(/</g, '&lt;'); }
function fmtWhen(t) { return new Date(t).toTimeString().slice(0, 8); }
/* the same key touchDevice() computes server-side, so a row's expand state
   survives the 4 s refresh instead of resetting every time it re-renders */
function deviceKey(d) { return d.mac || d.id || d.ip || 'unknown'; }

let lastDevices = [];
const expandedDevices = new Set();

function renderDevices(devices) {
  lastDevices = devices;
  renderDeviceCount();
  const box = $('#devices');
  if (!devices.length) {
    box.innerHTML = '<div class="devices-empty">No device has polled this session yet.</div>';
    return;
  }
  box.innerHTML = devices.map((d) => {
    const key = deviceKey(d);
    const open = expandedDevices.has(key);
    const who = esc(d.id || d.mac || '(unidentified)');
    const sub = [d.mac && d.mac !== d.id ? d.mac : null, d.board].filter(Boolean).map(esc).join(' · ') || esc(d.ip);
    const last = d.recent[0];
    const outcome = last ? (last.label === 'ok' ? '' : ` · <span class="warn">${esc(last.label)}</span>`) : '';
    const hist = !d.recent.length ? '<div class="dhist-empty">No polls recorded yet.</div>'
      : d.recent.map((h) => {
          const cls = h.label === 'ok' ? 'ok' : 'bad';
          return `<div class="dhist-row"><time>${fmtWhen(h.t)}</time><span class="st ${cls}">${h.status}</span><span>${esc(h.label)}</span></div>`;
        }).join('');
    return `<div class="dgroup${open ? ' open' : ''}" data-key="${esc(key)}">
      <div class="drow">
        <span class="dot${d.active ? ' on' : ''}"></span>
        <span class="who"><span class="chev">&#9656;</span>${who}<span class="sub">${sub}</span></span>
        <span class="meta">${d.pollCount} poll${d.pollCount === 1 ? '' : 's'}${outcome} · ${fmtAgo(d.lastSeen)}</span>
      </div>
      <div class="dhist${open ? ' open' : ''}"><div class="dhist-body">${hist}</div></div>
    </div>`;
  }).join('');
}
$('#devices').addEventListener('click', (e) => {
  const group = e.target.closest('.dgroup');
  if (!group) return;
  const key = group.dataset.key;
  if (expandedDevices.has(key)) expandedDevices.delete(key); else expandedDevices.add(key);
  /* Toggled on the DOM node already there, not a re-render from scratch —
     the accordion only animates when the browser sees the *same* element
     change class, never on one that was just destroyed and recreated.   */
  const open = expandedDevices.has(key);
  group.classList.toggle('open', open);
  const hist = group.querySelector('.dhist');
  if (hist) hist.classList.toggle('open', open);
});

/* Live count badge, top-right of the connection block — one click jumps
   down to the Devices section itself, never re-fetches anything on its own. */
function renderDeviceCount() {
  const n = lastDevices.length;
  $('#devCountN').textContent = n;
  $('#devCountLabel').textContent = n === 1 ? 'device' : 'devices';
  $('#devCountDot').classList.toggle('on', lastDevices.some((d) => d.active));
}
$('#devCountBtn').onclick = () => {
  $('#devicesSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
};

async function loadState() { state = await api('GET', '/api/state'); }
async function loadDevices() { renderDevices((await api('GET', '/api/devices')).devices); }

$$('#lvls .lvl').forEach((el) => el.onclick = () => {
  pending.level = el.dataset.l;
  if (pending.message === null || Object.values(DEFAULT_MSG).includes($('#msg').value)) {
    pending.message = DEFAULT_MSG[pending.level];
  }
  renderControls();
  syncApplyButton();
});
$('#msg').addEventListener('input', () => { pending.message = $('#msg').value; renderPresets(); syncApplyButton(); });

$('#applyAll').onclick = async () => {
  if (pending.level !== null || pending.message !== null) {
    await api('POST', '/api/alert', {
      level: pending.level ?? state.alert.level,
      message: pending.message ?? state.alert.message,
    });
  }
  for (const [key, pattern] of Object.entries(pending.patterns)) {
    const [gateway, ...rest] = key.split('/');
    await api('POST', '/api/pattern', { gateway, name: rest.join('/'), pattern });
  }
  if (pending.fault !== undefined) {
    await api('POST', '/api/fault', { type: pending.fault || null });
  }
  pending = emptyPending();
  await loadState();
  renderControls();
  syncApplyButton();
};

$('#resetAll').onclick = async () => {
  await api('POST', '/api/reset');
  pending = emptyPending();
  await loadState();
  renderControls();
  syncApplyButton();
};

$('#epUrl').textContent = location.origin + '/v1/gateway_health';

(async () => {
  await loadState();
  renderControls();
  syncApplyButton();
  await loadDevices();
})();

/* background: live sparkline/stat/log/devices refresh only — never the form controls */
setInterval(async () => { await loadState(); renderLiveReadouts(); await loadDevices(); }, 4000);

/* ---------------------------------------------------------------- bgfx
   A quiet drifting-particle backdrop, sitting behind everything at z-index
   0. Purely decorative — it never reads or reflects real state, so it can
   never be mistaken for a status indicator. Respects reduced-motion by
   drawing exactly one static frame instead of looping, and pauses the
   loop whenever the tab is hidden so it never spends CPU off-screen.    */
(function bgfx() {
  const canvas = document.getElementById('bgfx');
  const ctx = canvas.getContext('2d');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w, h, dpr, pts;

  function seed() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = canvas.width = innerWidth * dpr;
    h = canvas.height = innerHeight * dpr;
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
    const count = Math.min(70, Math.max(24, Math.floor((innerWidth * innerHeight) / 22000)));
    pts = Array.from({ length: count }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.16 * dpr,
      vy: (Math.random() - 0.5) * 0.16 * dpr,
      r: (Math.random() * 1.1 + 0.6) * dpr,
    }));
  }

  function frame() {
    const linkDist = 110 * dpr;
    ctx.clearRect(0, 0, w, h);
    for (const p of pts) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > w) p.vx *= -1;
      if (p.y < 0 || p.y > h) p.vy *= -1;
    }
    for (let i = 0; i < pts.length; i++) {
      for (let j = i + 1; j < pts.length; j++) {
        const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y;
        const d = Math.hypot(dx, dy);
        if (d < linkDist) {
          ctx.strokeStyle = `rgba(34,211,238,${(1 - d / linkDist) * 0.12})`;
          ctx.lineWidth = dpr;
          ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[j].x, pts[j].y); ctx.stroke();
        }
      }
    }
    ctx.fillStyle = 'rgba(120,175,235,.4)';
    for (const p of pts) { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }
  }

  let raf = null;
  function loop() { frame(); raf = requestAnimationFrame(loop); }
  function start() { if (!reduceMotion && raf === null && !document.hidden) loop(); }
  function stop() { if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }

  seed();
  if (reduceMotion) { frame(); }            // one static frame, never a loop
  else { start(); }

  document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); else start(); });
  let resizeTimer;
  addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { seed(); if (reduceMotion) frame(); }, 150);
  });
})();
</script>
</body>
</html>
